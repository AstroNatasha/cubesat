experiment:
  name: mobilenet_kd
  seed: 42
  output_dir: results/mobilenet_kd

dataset:
  name: eurosat
  root: data/eurosat
  image_size: 64
  num_classes: 10
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  num_workers: 4

model:
  name: mobilenet_v3_small
  pretrained: false

teacher:
  name: resnet18_teacher
  checkpoint: results/resnet18_teacher/best.pt

training:
  epochs: 60
  batch_size: 128
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0001
  scheduler: cosine
  early_stopping_patience: 10
  use_kd: true

distillation:
  enabled: true
  temperature: 4.0
  alpha: 0.7          # weight for KD loss vs. cross-entropy
