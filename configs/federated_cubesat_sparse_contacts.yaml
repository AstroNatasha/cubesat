experiment:
  name: federated_cubesat_sparse_contacts
  seed: 42
  output_dir: results/federated_cubesat_sparse_contacts

dataset:
  name: eurosat
  root: data/eurosat
  image_size: 64
  num_classes: 10
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  num_workers: 4

model:
  name: baseline_cnn

federated:
  num_clients: 10
  num_rounds: 20
  local_epochs: 5
  batch_size: 32
  # Only 3 of 10 clients participate each round — models partial, intermittent
  # ground contact windows where not all CubeSats are reachable simultaneously.
  clients_per_round: 3
  partitioning: noniid
  dominant_classes_per_client: 2

training:
  lr: 0.001
  weight_decay: 0.0001

compression:
  mode: int8_quantization

mission_constraints:
  max_total_communication_MB: 50
  model_size_limit_MB: 4.2
  daily_downlink_budget_MB: 2.16
  link_rate_kbps: 9.6
  contact_window_minutes: 10
  contacts_per_day: 3

verbose: true
