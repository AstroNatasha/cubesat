experiment:
  name: resnet18_teacher
  seed: 42
  output_dir: results/resnet18_teacher

dataset:
  name: eurosat
  root: data/eurosat
  # 64×64 matches the student and KD data pipeline — teacher soft labels must come
  # from the same resolution the student sees, otherwise the teacher is evaluating
  # a distribution it was never trained on and produces unreliable guidance.
  image_size: 64
  num_classes: 10
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  num_workers: 4

model:
  name: resnet18_teacher
  pretrained: true   # fine-tune from ImageNet weights

training:
  epochs: 15 #30
  batch_size: 64
  optimizer: sgd
  lr: 0.01
  weight_decay: 0.0001
  scheduler: cosine
  early_stopping_patience: 8
